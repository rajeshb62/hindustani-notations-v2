<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hindustani notations</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08070f; --text:#ece4dc; --dim:#6e6574; --accent:#c8b89a; --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden}
#app{max-width:960px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.35);flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
#rw{height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(200,184,154,.3);background:transparent;color:var(--accent);font-size:.7rem;font-weight:700}
#scrub-wrap{flex:1;min-width:140px;position:relative}
#fb-marks{position:relative;height:6px;margin-top:3px}
.fbm{position:absolute;top:0;height:6px;min-width:3px;border-radius:2px;background:rgba(244,132,95,.75);cursor:pointer}
.fbm.sel{background:#ffd27a;box-shadow:0 0 0 1px #ffd27a}
.fbm.live{background:rgba(255,210,122,.45)}
#fb-dialog{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#fb-dialog.on{display:flex}
#fb-card{background:#14111d;border:1px solid var(--line);border-radius:10px;padding:16px;width:min(560px,92vw)}
#fb-range{font-size:.78rem;color:var(--accent);margin-bottom:8px;letter-spacing:.04em}
#fb-text{width:100%;height:120px;background:#0d0b14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:inherit;font-size:.9rem;resize:vertical}
#fb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.68rem;color:var(--dim)}
#fb-actions button{margin-left:6px}
#fb-panel{display:none;max-height:28vh;overflow:auto;border-top:1px solid var(--line);background:rgba(0,0,0,.35);font-size:.78rem}
#fb-panel.on{display:block}
.fbi{display:flex;gap:10px;align-items:flex-start;padding:7px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.fbi:hover{background:rgba(255,255,255,.04)}
.fbi .r{color:var(--accent);white-space:nowrap;min-width:110px}
.fbi .x{margin-left:auto;color:var(--dim);background:none;border:none;font-size:.9rem}
.fbi.sel{background:rgba(255,210,122,.08)}
#scrub{width:100%;appearance:none;height:3px;background:rgba(255,255,255,.12);border-radius:2px}
#scrub::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
#time{font-size:.7rem;color:var(--dim);letter-spacing:.04em}
.pill{padding:7px 12px;border-radius:999px;border:1px solid rgba(200,184,154,.35);background:rgba(200,184,154,.08);color:var(--accent);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.on{background:rgba(82,183,136,.16);border-color:rgba(82,183,136,.5);color:#9de0b8}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#note{font-family:'EB Garamond',Georgia,serif;font-size:clamp(84px,18vw,168px);font-weight:700;line-height:1}
#note.komal{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px}
#oct-a,#oct-b{height:22px;font-size:16px;opacity:0}
#oct-a.on,#oct-b.on{opacity:1}
#meta{margin-top:12px;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,224,216,.55);text-align:center}
#cents{margin-top:6px;font-size:.72rem;color:var(--dim)}
#cents.bad{color:#e07a7a}
#confbar{width:min(260px,70vw);height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:12px;overflow:hidden}
#conffill{height:100%;background:currentColor;width:0}
#tl{height:76px;border-top:1px solid var(--line);background:rgba(0,0,0,.35);overflow:hidden;position:relative}
#track{display:flex;align-items:center;height:100%;position:absolute;left:50%;white-space:nowrap}
.tn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:70px;cursor:pointer;opacity:.35}
.tn.cur{opacity:1}
.tn.low{opacity:.18}
.tc{font-family:'EB Garamond',serif;font-size:1.3rem;font-weight:700}
#tl::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.12)}
#foot{display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--line);font-size:.65rem;color:var(--dim)}
#empty{padding:40px 24px;text-align:center;color:var(--dim);line-height:1.6}
select{background:#12101a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="play" title="Space">▶</button>
    <button id="rw" title="Rewind 5s">↺ 5s</button>
    <div id="scrub-wrap">
      <input id="scrub" type="range" min="0" max="100" step="0.01" value="0"/>
      <div id="fb-marks"></div>
      <div id="time">0:00 / 0:00</div>
    </div>
    <button class="pill" id="mode" title="N cycles recording / notes / pitch curve">Hearing: Recording</button>
    <button class="pill" id="fb" title="F: mark start, F again: mark end and write feedback">✎ Feedback</button>
    <button class="pill" id="loop" title="L: loop the selected range · again: loop A/B (recording ↔ notes each pass) · again: off">Loop: off</button>
    <button class="pill" id="speed" title="Playback speed (pitch preserved)">1×</button>
    <label style="font-size:.68rem;color:var(--dim)">Vol
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" style="width:70px;vertical-align:middle"/>
    </label>
    <select id="catalog" title="Performance"></select>
  </div>
  <div id="stage">
    <div id="oct-a">●</div>
    <div id="note">—</div>
    <div id="oct-b">●</div>
    <div id="meta">Load a performance…</div>
    <div id="cents"></div>
    <div id="confbar"><div id="conffill"></div></div>
  </div>
  <div id="tl"><div id="track"></div></div>
  <div id="fb-panel"></div>
  <div id="foot">
    <span id="sa-src">Sa from the transcription</span>
    <span><a href="#" id="fb-list" style="color:var(--accent)">Feedback (0)</a> · Space play · N recording / notes / pitch curve · F feedback · L loop</span>
  </div>
  <div id="fb-dialog"><div id="fb-card">
    <div id="fb-range"></div>
    <textarea id="fb-text" placeholder="What's wrong (or right) in this stretch?"></textarea>
    <div id="fb-actions"><span>⌘/Ctrl+Enter save · Esc cancel</span>
      <span><button class="pill" id="fb-cancel">Cancel</button><button class="pill on" id="fb-save">Save</button></span></div>
  </div></div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
const JUST = {S:1,r:256/243,R:9/8,g:32/27,G:5/4,M:4/3,'M+':45/32,P:3/2,d:128/81,D:5/3,n:16/9,N:15/8};
const TABLE_POS = Object.fromEntries(Object.entries(JUST).map(([k, r]) => [k, 1200 * Math.log2(r)]));
// Cents above Sa for each swara: measured for this performance when the
// pipeline calibrated it (performance.json swara_positions), else the just table.
let POS = TABLE_POS;
const COLORS = {S:'#E63946',r:'#F4845F',R:'#F4845F',g:'#E9C46A',G:'#E9C46A',M:'#52B788','M+':'#52B788',P:'#2EC4B6',d:'#4895EF',D:'#4895EF',n:'#C77DFF',N:'#C77DFF'};
const NAMES = {S:'Sa',r:'Re komal',R:'Re shuddh',g:'Ga komal',G:'Ga shuddh',M:'Ma shuddh','M+':'Ma tivra',P:'Pa',d:'Dha komal',D:'Dha shuddh',n:'Ni komal',N:'Ni shuddh'};
const KOMAL = new Set(['r','g','d','n']);

let perf = null;
let baseSa = 96.97;
let allNotes = [];
let notes = [];      // what is shown and played
let mode = 'audio';
let playing = false;
let idx = -1;
let ctx, master, flute, fluteGain, droneGain, droneSa = null;

const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);

function currentSa(){ return baseSa; }

function mapHz(hz){
  const sa = currentSa();
  const cents = 1200 * Math.log2(hz/sa);
  let oct = Math.floor(cents/1200);
  let local = cents - oct*1200;
  let best='S', err=1e9, bo=oct;
  for (const [name, sc] of Object.entries(POS)){
    let e = local-sc, o=oct;
    if(name==='S' && Math.abs(local-1200)<Math.abs(e)){ e=local-1200; o=oct+1; }
    if(Math.abs(e)<Math.abs(err)){ err=e; best=name; bo=o; }
  }
  const ideal = sa * Math.pow(2, (POS[best] + 1200*bo) / 1200);
  const label = bo>0 ? best+"'".repeat(bo) : bo<0 ? best+'.'.repeat(-bo) : best;
  return {swara:best, octave:bo, cents_off:err, label, ideal, color:COLORS[best]||'#fff', komal:KOMAL.has(best), name:NAMES[best]||best};
}

function remap(){
  if(!perf) return;
  allNotes = perf.notes.map(n => {
    const m = mapHz(n.hz);
    return {...n, ...m};
  });
  applyView();
}

function applyView(){
  schedStop();
  // Errors (out-of-range bleed, octave flips) are already removed by the
  // pipeline; see performance.json removed_notes.
  notes = allNotes;
  buildTimeline();
}

function fmt(t){ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60); const s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

let fluteOpen = false;

function ensureAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = parseFloat($('vol').value);
  master.connect(ctx.destination);
}

async function resumeAudio(){
  ensureAudio();
  if(ctx.state !== 'running'){
    try{ await ctx.resume(); }catch(e){}
  }
  return ctx.state === 'running';
}

function initFlute(freq){
  ensureAudio();
  if(flute) return;
  const now = ctx.currentTime;
  const fund = ctx.createOscillator(); fund.type = 'sine'; fund.frequency.setValueAtTime(freq, now);
  const h2 = ctx.createOscillator(); h2.type = 'sine'; h2.frequency.setValueAtTime(freq * 2, now);
  const h2g = ctx.createGain(); h2g.gain.setValueAtTime(0.08, now);
  fluteGain = ctx.createGain(); fluteGain.gain.setValueAtTime(0.0001, now);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, now);
  fund.connect(fluteGain); h2.connect(h2g); h2g.connect(fluteGain);
  fluteGain.connect(lp); lp.connect(master);
  fund.start(now); h2.start(now);
  flute = {fund, h2, h2g};
}

function openFlute(){
  if(!fluteGain || !ctx) return;
  const now = ctx.currentTime;
  fluteGain.gain.cancelScheduledValues(now);
  fluteGain.gain.setValueAtTime(Math.max(0.0001, fluteGain.gain.value), now);
  fluteGain.gain.linearRampToValueAtTime(0.62, now + 0.05);
  fluteOpen = true;
}

function stopFlute(){
  if(!fluteGain || !ctx || !fluteOpen) return;
  const now = ctx.currentTime;
  fluteGain.gain.cancelScheduledValues(now);
  fluteGain.gain.setValueAtTime(Math.max(0.0001, fluteGain.gain.value), now);
  fluteGain.gain.linearRampToValueAtTime(0.0001, now + 0.06);
  fluteOpen = false;
}

async function setDrone(on){
  await resumeAudio();
  if(droneGain && droneSa !== currentSa()){
    // Loaded a performance with a different Sa: rebuild the drone.
    droneGain.oscs.forEach(o => { o.stop(); o.disconnect(); });
    droneGain.disconnect(); droneGain = null;
  }
  if(on && !droneGain){
    const sa=currentSa();
    droneSa = sa;
    const g=ctx.createGain(); g.gain.value=0;
    const specs=[[sa,0.4],[sa*2,0.16],[sa*3/2,0.08]];
    g.oscs = specs.map(([f,a])=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const gg=ctx.createGain(); gg.gain.value=a;
      o.connect(gg); gg.connect(g); o.start();
      return o;
    });
    g.connect(master);
    droneGain=g;
  }
  if(droneGain){
    droneGain.gain.setTargetAtTime(on?0.28:0, ctx.currentTime, 0.08);
  }
}

// The Sa drone accompanies the synth: on whenever notes or the pitch curve
// are playing, off for the recording (which has its own tanpura) and when paused.
function syncDrone(){ setDrone(playing && mode !== 'audio'); }

// Measured pitch curve (cents above Sa) for glide-faithful playback.
const BRIDGE_GAP = 0.075;
function contourHz(t){
  const c = perf && perf.contour;
  if(!c || !c.runs.length) return null;
  const runs = c.runs;
  let lo=0, hi=runs.length-1, found=-1;
  while(lo<=hi){const mid=(lo+hi)>>1; if(runs[mid][0]<=t){found=mid;lo=mid+1;} else hi=mid-1;}
  if(found<0) return null;
  const [t0, cents] = runs[found];
  const k = (t - t0) / c.step;
  if(k > cents.length - 1){
    // Between runs: glide across short tracker dropouts (same 75 ms tolerance
    // the transcriber uses to join notes); longer gaps are silence.
    const end = t0 + (cents.length - 1) * c.step;
    const next = runs[found + 1];
    if(!next || next[0] - end > BRIDGE_GAP) return k > cents.length - 0.5 ? null : currentSa() * Math.pow(2, cents[cents.length-1] / 1200);
    const f = (t - end) / (next[0] - end);
    const cc = cents[cents.length-1] * (1 - f) + next[1][0] * f;
    return currentSa() * Math.pow(2, cc / 1200);
  }
  const i = Math.min(cents.length - 1, Math.max(0, Math.floor(k)));
  const j = Math.min(cents.length - 1, i + 1);
  const f = Math.min(1, Math.max(0, k - i));
  const cc = cents[i] * (1 - f) + cents[j] * f;
  return currentSa() * Math.pow(2, cc / 1200);
}

function findNote(t){
  let lo=0,hi=notes.length-1,found=-1;
  while(lo<=hi){const mid=(lo+hi)>>1; if(notes[mid].t<=t){found=mid;lo=mid+1;} else hi=mid-1;}
  if(found<0) return -1;
  const n=notes[found];
  if(t < n.t + n.dur + 0.04) return found;
  return -2;
}

function showNote(i){
  if(i===idx) return;
  idx=i;
  const el=$('note'), meta=$('meta'), cents=$('cents');
  if(i<0){
    el.textContent='—'; el.style.color='rgba(255,255,255,.12)'; el.className='';
    meta.textContent = i===-2 ? 'Silence' : '—';
    cents.textContent='';
    $('oct-a').className=''; $('oct-b').className='';
    highlight(-1);
    return;
  }
  const n=notes[i];
  el.textContent = n.swara==='M+' ? 'M+' : n.swara;
  el.style.color=n.color;
  el.className = n.komal ? 'komal' : '';
  $('oct-a').textContent='●'.repeat(Math.max(1,n.octave));
  $('oct-a').className=n.octave>0?'on':'';
  $('oct-b').textContent='●'.repeat(Math.max(1,-n.octave));
  $('oct-b').className=n.octave<0?'on':'';
  meta.textContent = `${n.name}  ·  ${n.octave===0?'madhya':n.octave>0?'taar':'mandra'}`;
  const off = n.cents_off;
  cents.textContent = `${off>=0?'+':''}${off.toFixed(1)} ¢ from ideal  ·  ${n.hz.toFixed(1)} Hz  ·  conf ${(n.conf*100).toFixed(0)}%`;
  cents.className = Math.abs(off)>25 ? 'bad' : '';
  $('conffill').style.width = (n.conf*100)+'%';
  $('conffill').style.background = n.color;
  highlight(i);
}

function buildTimeline(){
  const track=$('track');
  track.innerHTML='';
  hl = -1; idx = -1;
  notes.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='tn'+(n.conf<0.35?' low':'');
    d.innerHTML=`<div class="tc" style="color:${n.color}">${n.swara==='M+'?'M+':n.swara}</div>`;
    d.onclick=()=>{ seek(n.t); };
    track.appendChild(d);
  });
}
let hl = -1;
function highlight(i){
  const kids=$('track').children;
  if(kids[hl]) kids[hl].classList.remove('cur');
  if(kids[i]) kids[i].classList.add('cur');
  hl = i;
  if(i>=0 && kids[i]){
    const x = kids[i].offsetLeft + kids[i].offsetWidth/2;
    $('track').style.transform = `translateX(${-x}px)`;
  }
}

function tnow(){ return audio.currentTime || 0; }
function applyMix(){
  const v = parseFloat($('vol').value);
  if(master) master.gain.value = v;
  // Keep the recording as a silent clock in notes mode; do not use
  // audio.muted — some browsers treat that as "tab is silent".
  audio.volume = (mode === 'audio') ? v : 0;
}

// Synth playback is scheduled on the Web Audio clock ahead of time, so 20-40 ms
// ornaments start on time. It is driven by a Web Worker timer, not
// requestAnimationFrame: browsers pause or throttle rAF (and main-thread
// timers) in background tabs — Firefox to ~1/s — and the synth then held one
// note for many seconds. Hidden tabs also schedule further ahead in case
// wake-ups are late.
const LOOKAHEAD_VISIBLE = 0.25;
const LOOKAHEAD_HIDDEN = 2.0;
function lookahead(){ return document.hidden ? LOOKAHEAD_HIDDEN : LOOKAHEAD_VISIBLE; }
// Playback speed: audio seconds advance at `rate` per wall-clock second, so
// a note dt audio-seconds away starts dt/rate later on the Web Audio clock.
let rate = 1;
const LEGATO_GAP = 0.12;  // hold the tone across gaps shorter than this
const LEVEL = 0.62;
let sched = null;         // notes mode: {i, lastFreq, lastEnd, minAt}
let csched = null;        // pitch-curve mode: {tNext, open, minAt}

// Glide into each note: a short note is approached, not snapped to (snapping
// makes fast passages click). Capped so held notes still land promptly.
function glideFor(n){ return Math.max(0.012, Math.min(0.045, n.dur * 0.35)); }

function schedStop(){
  sched = null;
  csched = null;
  if(!ctx || !flute) return;
  const now = ctx.currentTime;
  for(const p of [flute.fund.frequency, flute.h2.frequency]){
    const v = p.value; p.cancelScheduledValues(now); p.setValueAtTime(v, now);
  }
  const g = fluteGain.gain.value;
  fluteGain.gain.cancelScheduledValues(now);
  fluteGain.gain.setValueAtTime(Math.max(0.0001, g), now);
  fluteGain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
  fluteOpen = false;
}

function schedStart(t){
  initFlute(notes.length ? notes[0].ideal : currentSa());
  // First note still sounding at t, or the next one to come.
  let lo=0, hi=notes.length;
  while(lo<hi){ const mid=(lo+hi)>>1; if(notes[mid].t + notes[mid].dur <= t) lo=mid+1; else hi=mid; }
  sched = {i: lo, lastFreq: null, lastEnd: null, minAt: ctx.currentTime + 0.025};
}

function pump(t){
  const now = ctx.currentTime;
  const f1 = flute.fund.frequency, f2 = flute.h2.frequency, gain = fluteGain.gain;
  while(sched.i < notes.length && notes[sched.i].t < t + lookahead() * rate){
    const n = notes[sched.i];
    const at = Math.max(sched.minAt, now + (n.t - t) / rate);
    const legato = sched.lastEnd !== null && n.t - sched.lastEnd <= LEGATO_GAP;
    if(legato){
      const g = glideFor(n) / rate;
      f1.setValueAtTime(sched.lastFreq, at);     f1.linearRampToValueAtTime(n.ideal, at + g);
      f2.setValueAtTime(sched.lastFreq * 2, at); f2.linearRampToValueAtTime(n.ideal * 2, at + g);
    } else {
      // New phrase: start on pitch and fade in.
      f1.setValueAtTime(n.ideal, at); f2.setValueAtTime(n.ideal * 2, at);
      gain.setValueAtTime(0.0001, at); gain.linearRampToValueAtTime(LEVEL, at + 0.03);
    }
    const end = n.t + n.dur;
    const next = notes[sched.i + 1];
    if(!next || next.t - end > LEGATO_GAP){
      const endAt = Math.max(at + 0.03, now + (end - t) / rate);
      gain.setValueAtTime(LEVEL, endAt); gain.linearRampToValueAtTime(0.0001, endAt + 0.06);
    }
    sched.lastFreq = n.ideal; sched.lastEnd = end; sched.i++;
  }
}

// Pitch curve: one automation point per 10 ms contour frame, scheduled ahead.
const CURVE_STEP = 0.01;
function pumpContour(t){
  if(!csched){
    initFlute(contourHz(t) || currentSa());
    csched = {tNext: t, open: false, minAt: ctx.currentTime + 0.025};
  }
  if(csched.tNext < t) csched.tNext = t;  // fell behind (e.g. long stall): resync
  const now = ctx.currentTime;
  const f1 = flute.fund.frequency, f2 = flute.h2.frequency, gain = fluteGain.gain;
  const until = t + lookahead() * rate;
  while(csched.tNext < until){
    const tt = csched.tNext;
    const at = Math.max(csched.minAt, now + (tt - t) / rate);
    const hz = contourHz(tt);
    if(hz){
      if(!csched.open){
        f1.setValueAtTime(hz, at); f2.setValueAtTime(hz * 2, at);
        gain.setValueAtTime(0.0001, at); gain.linearRampToValueAtTime(LEVEL, at + 0.03);
        csched.open = true;
      } else {
        f1.linearRampToValueAtTime(hz, at); f2.linearRampToValueAtTime(hz * 2, at);
      }
    } else if(csched.open){
      gain.setValueAtTime(LEVEL, at); gain.linearRampToValueAtTime(0.0001, at + 0.04);
      csched.open = false;
    }
    csched.minAt = at;
    csched.tNext = tt + CURVE_STEP;
  }
}

function drive(t){
  if(!playing || mode==='audio' || !ctx) return;
  if(mode==='notes'){
    if(!sched) schedStart(t);
    pump(t);
  } else {
    pumpContour(t);
  }
}

// Audio clock: a worker timer keeps firing in background tabs.
const audioTicker = new Worker(URL.createObjectURL(new Blob(
  ['setInterval(() => postMessage(0), 50);'], {type: 'text/javascript'})));
audioTicker.onmessage = () => { checkLoop(); drive(tnow()); };

function seek(t){
  audio.currentTime = t;
  schedStop();
  drive(t);
}

function tick(){
  checkLoop();
  const t=tnow();
  const i=findNote(t);
  showNote(i);  // display only; sound is driven by audioTicker
  $('scrub').value = audio.duration ? (t/audio.duration)*100 : 0;
  $('time').textContent = `${fmt(t)} / ${fmt(audio.duration||0)}`;
  requestAnimationFrame(tick);
}

async function toggle(){
  await resumeAudio();
  if(playing){
    audio.pause(); schedStop(); stopFlute(); playing=false; $('play').textContent='▶';
  } else {
    applyMix();
    try{ await audio.play(); }catch(e){}
    playing=true; $('play').textContent='❚❚';
    drive(tnow());
  }
  syncDrone();
}
// Recording → quantized notes → measured pitch curve (keeps meend/gamak).
const MODES = ['audio','notes','contour'];
const MODE_LABEL = {audio:'Recording', notes:'Notes', contour:'Pitch curve'};
function nextMode(){
  let n = MODES[(MODES.indexOf(mode)+1) % MODES.length];
  if(n==='contour' && !(perf && perf.contour)) n = 'audio';
  return n;
}
async function setMode(next){
  schedStop();
  mode=next;
  $('mode').textContent = 'Hearing: ' + MODE_LABEL[mode];
  $('mode').classList.toggle('on', mode!=='audio');
  applyMix();
  if(mode==='audio'){
    stopFlute();
  } else {
    await resumeAudio();
    if(playing){
      try{ await audio.play(); }catch(e){}
      drive(tnow());
    }
  }
  syncDrone();
}

// ---- Listening feedback: a time range + free text, saved per performance ----
let slug = null;
let feedback = [];      // [{start, end, text, mode, created}]
let fbStart = null;     // mark in progress (audio seconds)
let selected = null;    // {start, end}: range for Loop (clicked feedback or last mark)

function fmtPrecise(t){ const m=Math.floor(t/60); return m+':'+(t%60).toFixed(1).padStart(4,'0'); }

async function loadFeedback(){
  feedback = [];
  try{ const r = await fetch(`./data/${slug}/feedback.json`); if(r.ok) feedback = await r.json(); }catch(e){}
  renderFeedback();
}
async function saveFeedback(){
  const r = await fetch(`/api/feedback/${slug}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(feedback)});
  if(!r.ok) alert('Could not save feedback: ' + r.status);
  renderFeedback();
}
function renderFeedback(){
  const dur = audio.duration || perf?.notes?.at(-1)?.t || 1;
  const marks = $('fb-marks'); marks.innerHTML = '';
  const span = (a, b, cls, title, onclick) => {
    const d = document.createElement('div'); d.className = 'fbm ' + cls;
    d.style.left = (100*a/dur) + '%'; d.style.width = Math.max(0.15, 100*(b-a)/dur) + '%';
    if(title) d.title = title; if(onclick) d.onclick = onclick; marks.appendChild(d);
  };
  feedback.forEach(f => span(f.start, f.end, isSel(f) ? 'sel' : '', `${fmtPrecise(f.start)}–${fmtPrecise(f.end)}  ${f.text}`, () => select(f)));
  if(fbStart !== null) span(fbStart, Math.max(fbStart, tnow()), 'live');
  $('fb-list').textContent = `Feedback (${feedback.length})`;
  const panel = $('fb-panel'); panel.innerHTML = '';
  feedback.forEach((f, k) => {
    const row = document.createElement('div'); row.className = 'fbi' + (isSel(f) ? ' sel' : '');
    row.innerHTML = `<span class="r">${fmtPrecise(f.start)} – ${fmtPrecise(f.end)}</span><span class="t"></span><button class="x" title="Delete">✕</button>`;
    row.querySelector('.t').textContent = f.text;
    row.onclick = () => select(f);
    row.querySelector('.x').onclick = ev => { ev.stopPropagation(); if(confirm('Delete this feedback?')){ feedback.splice(k, 1); saveFeedback(); } };
    panel.appendChild(row);
  });
}
function isSel(f){ return selected && selected.start === f.start && selected.end === f.end; }
function select(f){ selected = {start: f.start, end: f.end}; seek(f.start); renderFeedback(); }

function feedbackKey(){
  if(fbStart === null){ fbStart = tnow(); $('fb').classList.add('on'); $('fb').textContent = `● ${fmtPrecise(fbStart)} … F`; renderFeedback(); return; }
  let a = fbStart, b = tnow(); if(b < a) [a, b] = [b, a];
  if(b - a < 0.5) b = a + 0.5;  // a single tap marks a short stretch
  fbStart = null; $('fb').classList.remove('on'); $('fb').textContent = '✎ Feedback';
  selected = {start: a, end: b};
  if(playing) toggle();
  $('fb-range').textContent = `${fmtPrecise(a)} – ${fmtPrecise(b)}  ·  ${perf.title}  ·  hearing ${MODE_LABEL[mode]}`;
  $('fb-text').value = ''; $('fb-dialog').classList.add('on'); $('fb-text').focus();
  $('fb-save').onclick = () => {
    const text = $('fb-text').value.trim(); closeDialog();
    if(!text) return;
    feedback.push({start: +a.toFixed(2), end: +b.toFixed(2), text, mode, created: new Date().toISOString()});
    feedback.sort((x, y) => x.start - y.start); saveFeedback();
  };
}
function closeDialog(){ $('fb-dialog').classList.remove('on'); renderFeedback(); }

// ---- Loop the selected range; A/B alternates recording and notes each pass ----
let loopMode = 'off';  // off | loop | ab
function cycleLoop(){
  loopMode = {off: 'loop', loop: 'ab', ab: 'off'}[loopMode];
  if(loopMode !== 'off' && !selected){
    const t = tnow(); selected = {start: Math.max(0, t - 4), end: t + 4};  // nothing selected: ±4 s around here
  }
  $('loop').textContent = {off: 'Loop: off', loop: 'Loop', ab: 'Loop A/B'}[loopMode];
  $('loop').classList.toggle('on', loopMode !== 'off');
  if(loopMode !== 'off' && (tnow() < selected.start || tnow() > selected.end)) seek(selected.start);
  renderFeedback();
}
function checkLoop(){
  if(loopMode === 'off' || !selected || !playing) return;
  if(tnow() >= selected.end){
    if(loopMode === 'ab') setMode(mode === 'audio' ? 'notes' : 'audio');
    seek(selected.start);
  }
}

// ---- Speed: pitch-preserved slow playback for fast passages ----
function cycleSpeed(){
  rate = {1: 0.75, 0.75: 0.5, 0.5: 1}[rate];
  audio.preservesPitch = true; audio.mozPreservesPitch = true; audio.playbackRate = rate;
  $('speed').textContent = rate + '×'; $('speed').classList.toggle('on', rate !== 1);
  schedStop(); drive(tnow());
}

async function loadPerf(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error('Could not load '+url+' ('+res.status+')');
  perf=await res.json();
  baseSa=perf.sa_hz;
  POS = perf.swara_positions || TABLE_POS;
  const shift = perf.calibration?.sa_refine?.shift_cents;
  $('sa-src').textContent = 'Sa ' + baseSa.toFixed(2) + ' Hz'
    + (shift ? ` (tuned ${shift>0?'+':''}${shift.toFixed(1)}¢)` : '')
    + ' · ' + (perf.swara_positions ? 'measured swaras' : 'just table')
    + ' · ' + (perf.stats?.note_count||0) + ' notes';
  const dir = url.replace(/performance\.json$/, '');
  slug = dir.split('/').filter(Boolean).pop();
  fbStart = null; selected = null;
  audio.src = dir + perf.audio;
  if(mode==='contour' && !perf.contour) await setMode('audio');
  applyMix();
  remap();
  if(droneGain) syncDrone();  // rebuilds at the new Sa
  $('meta').textContent = perf.title + ' · press play';
  audio.playbackRate = rate;
  await loadFeedback();
  audio.addEventListener('loadedmetadata', renderFeedback, {once: true});
}

async function init(){
  let catalog=[];
  try{ catalog = await (await fetch('./catalog.json')).json(); }catch(e){}
  const sel=$('catalog');
  if(!catalog.length){
    $('meta').textContent='No performances yet. Run pipeline.run or bootstrap_legacy.py';
  }
  catalog.forEach((c,i)=>{
    const o=document.createElement('option');
    o.value=c.path; o.textContent=c.title;
    sel.appendChild(o);
  });
  sel.onchange=()=>loadPerf(sel.value);
  try{
    if(catalog[0]) await loadPerf(catalog[0].path);
  }catch(err){
    $('meta').textContent = 'Could not load track: '+err.message;
  }
  $('play').onclick=toggle;
  $('rw').onclick=()=>seek(Math.max(0,tnow()-5));
  $('mode').onclick=()=>setMode(nextMode());
  $('vol').oninput=()=>applyMix();
  $('fb').onclick=feedbackKey;
  $('loop').onclick=cycleLoop;
  $('speed').onclick=cycleSpeed;
  $('fb-cancel').onclick=closeDialog;
  $('fb-list').onclick=e=>{ e.preventDefault(); $('fb-panel').classList.toggle('on'); };
  $('fb-text').addEventListener('keydown', e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeDialog(); }
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); $('fb-save').click(); }
  });
  setInterval(()=>{ if(fbStart!==null) renderFeedback(); }, 250);  // grow the live range
  $('scrub').oninput=e=>{ if(audio.duration) seek((e.target.value/100)*audio.duration); };
  document.addEventListener('keydown', e=>{
    if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    if(e.code==='Space'){ e.preventDefault(); toggle(); }
    if(e.key==='n'||e.key==='N') setMode(nextMode());
    if(e.key==='f'||e.key==='F'){ e.preventDefault(); feedbackKey(); }
    if(e.key==='l'||e.key==='L') cycleLoop();
  });
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
